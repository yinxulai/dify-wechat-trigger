[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "wechat_work_trigger"
version = "0.1.2"
description = "Dify trigger plugin for WeCom AI bots"
authors = [
    { name = "yinxulai", email = "me@yinxulai.com" },
]
requires-python = ">=3.12"
dependencies = [
    "dify_plugin>=0.10.2,<1",
    "pycryptodome>=3.20.0",
    "werkzeug>=3.1.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
include = ["events*", "provider*"]
