name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: New version in MAJOR.MINOR.PATCH format
        required: true
        type: string

permissions:
  contents: write

env:
  DIFY_CLI_VERSION: 0.6.10
  DIFY_CLI_SHA256: 0cef74bcae375a4337c2ff7d42e4787717981a795e1c23cf56bb27ec07ec8304

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -e 'plugins/wechat-work-trigger[dev]'

      - name: Validate release version
        id: version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          (cd plugins/wechat-work-trigger && python scripts/version.py set "$VERSION")
          python -c 'from pathlib import Path; import re; version = __import__("os").environ["VERSION"]; paths = [Path("plugins/wechat-work-response/pyproject.toml"), Path("plugins/wechat-work-response/manifest.yaml")]; [p.write_text(re.sub(r"(?m)^(version(?:\s*=|:)\s*)(?:\"[^\"\n]+\"|[^\s#]+)", lambda m: m.group(1) + (("\"" + version + "\"") if "=" in m.group(1) else version), p.read_text()) for p in paths]'
          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            echo "Tag v${VERSION} already exists" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Compile Python sources
        run: |
          python -m compileall -q plugins/wechat-work-trigger/provider plugins/wechat-work-trigger/events plugins/wechat-work-trigger/main.py
          python -m compileall -q plugins/wechat-work-response/provider plugins/wechat-work-response/main.py

      - name: Run tests
        working-directory: plugins/wechat-work-trigger
        run: python -m pytest -q

      - name: Install Dify Plugin CLI
        run: |
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/dify" \
            "https://github.com/langgenius/dify-plugin-daemon/releases/download/${DIFY_CLI_VERSION}/dify-plugin-linux-amd64"
          echo "${DIFY_CLI_SHA256}  $RUNNER_TEMP/dify" | sha256sum --check
          chmod +x "$RUNNER_TEMP/dify"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Package plugin
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          dify plugin package plugins/wechat-work-trigger -o "dist/wechat_work_trigger-v${VERSION}.difypkg"
          dify plugin package plugins/wechat-work-response -o "dist/wechat_work_response-v${VERSION}.difypkg"

      - name: Commit version and create tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins/wechat-work-trigger plugins/wechat-work-response
          git commit -m "chore: release ${TAG}"
          git tag -a "$TAG" -m "$TAG"
          git push --atomic origin HEAD:main "refs/tags/${TAG}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release create "$TAG" dist/*.difypkg --generate-notes --title "$TAG"
