name: Checks

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -e '.[dev]'

      - name: Check versions
        id: version
        run: echo "version=$(python scripts/version.py check)" >> "$GITHUB_OUTPUT"

      - name: Compile Python sources
        run: python -m compileall -q provider events main.py

      - name: Run tests
        run: python -m pytest -q

      - name: Install Dify Plugin CLI
        env:
          DIFY_CLI_VERSION: 0.2.0
        run: |
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/dify" \
            "https://github.com/langgenius/dify-plugin-daemon/releases/download/${DIFY_CLI_VERSION}/dify-plugin-linux-amd64"
          chmod +x "$RUNNER_TEMP/dify"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Package plugin
        run: |
          mkdir -p dist
          dify plugin package . \
            -o "dist/wechat_work_trigger-v${{ steps.version.outputs.version }}.difypkg"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: wechat_work_trigger-v${{ steps.version.outputs.version }}
          path: dist/*.difypkg
          if-no-files-found: error
