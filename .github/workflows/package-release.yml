name: Package Published Release

on:
  release:
    types:
      - published

permissions:
  contents: write

env:
  DIFY_CLI_VERSION: 0.6.10
  DIFY_CLI_SHA256: 0cef74bcae375a4337c2ff7d42e4787717981a795e1c23cf56bb27ec07ec8304

concurrency:
  group: package-release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -e 'plugins/wechat-work-trigger[dev]'

      - name: Validate release version
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "Release tag must use vMAJOR.MINOR.PATCH format: $TAG" >&2
              exit 1
              ;;
          esac
          VERSION="$(cd plugins/wechat-work-trigger && python scripts/version.py check)"
          if [ "$TAG" != "v${VERSION}" ]; then
            echo "Release tag $TAG does not match plugin version v${VERSION}" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Compile Python sources
        run: |
          python -m compileall -q plugins/wechat-work-trigger/provider plugins/wechat-work-trigger/events plugins/wechat-work-trigger/main.py
          python -m compileall -q plugins/wechat-work-response/provider plugins/wechat-work-response/main.py

      - name: Run tests
        working-directory: plugins/wechat-work-trigger
        run: python -m pytest -q

      - name: Install Dify Plugin CLI
        run: |
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/dify" \
            "https://github.com/langgenius/dify-plugin-daemon/releases/download/${DIFY_CLI_VERSION}/dify-plugin-linux-amd64"
          echo "${DIFY_CLI_SHA256}  $RUNNER_TEMP/dify" | sha256sum --check
          chmod +x "$RUNNER_TEMP/dify"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Package plugin
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          dify plugin package plugins/wechat-work-trigger -o "dist/wechat_work_trigger-v${VERSION}.difypkg"
          dify plugin package plugins/wechat-work-response -o "dist/wechat_work_response-v${VERSION}.difypkg"

      - name: Upload package to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/*.difypkg --clobber
